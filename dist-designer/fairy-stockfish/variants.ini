; Custom chess variants for Chess Hacker (chess + roguelite + deckbuilder).
;
; Each variant inherits from the built-in `chess` and overrides only the
; board dimensions to match the seven sizes used in Standard mode
; (4x6 -> 8x8). 8x8 reuses the built-in `chess` directly.
;
; The engine is fed positions via `position fen <our serializeFen>`, so
; the per-variant `startFen` is unused in practice and simply omitted.
;
; Castling is automatically inert on these boards because our FEN never
; sets KQkq for non-8-file positions (see castlingAvailable in
; src/game/chess/rules.ts).

[chess-hacker4x6:chess]
maxFile = 4
maxRank = 6

[chess-hacker5x6:chess]
maxFile = 5
maxRank = 6

[chess-hacker5x7:chess]
maxFile = 5
maxRank = 7

[chess-hacker6x7:chess]
maxFile = 6
maxRank = 7

[chess-hacker7x7:chess]
maxFile = 7
maxRank = 7

[chess-hacker7x8:chess]
maxFile = 7
maxRank = 8
